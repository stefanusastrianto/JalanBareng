name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lib/**", "assets/**", "pubspec.yaml", "tool/**", ".github/workflows/build.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cek secrets
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          FB: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret DEBUG_KEYSTORE_B64 belum diisi. Jalankan workflow 'Buat kunci tanda tangan' dulu (lihat README)."; exit 1; fi
          if [ -z "$FB" ]; then echo "::error::Secret FIREBASE_API_KEY belum diisi (lihat README langkah 3)."; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true

      - name: Siapkan folder Android
        run: |
          flutter create --platforms=android --org id.jalanbareng --project-name jalan_bareng .
          python3 tool/patch_android.py

      - name: Pasang kunci tanda tangan
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          printf '%s' "$KS" | tr -d '\r\n ' | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore "$RUNNER_TEMP/jb.keystore"
          echo "JB_KEYSTORE=$RUNNER_TEMP/jb.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          ANDROID_CERT_SHA1: ${{ secrets.ANDROID_CERT_SHA1 }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          flutter pub get
          args=()
          for n in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_SENDER_ID FIREBASE_PROJECT_ID GOOGLE_WEB_CLIENT_ID GEMINI_API_KEY PLACES_API_KEY ANDROID_CERT_SHA1 FIREBASE_STORAGE_BUCKET; do
            v="$(printf '%s' "${!n}" | tr -d '\r\n ')"
            [ -n "$v" ] && args+=("--dart-define=$n=$v")
          done
          flutter build apk --release "${args[@]}"

      - name: Cek tanda tangan APK
        env:
          ANDROID_CERT_SHA1: ${{ secrets.ANDROID_CERT_SHA1 }}
        run: |
          SHA=$(keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA1:" | head -1 | sed 's/.*SHA1: //' | tr -d ' ')
          echo "SHA-1 APK (pakai titik): $(echo $SHA | tr ':' '.')"
          if [ "$SHA" != "$(printf '%s' "$ANDROID_CERT_SHA1" | tr -d '\r\n ')" ]; then echo "::error::APK tidak ditandatangani dengan kunci yang terdaftar"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: JalanBareng
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Terbitkan Release (APK bisa diunduh langsung di HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="v$VER-b${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk JalanBareng.apk
          gh release create "$TAG" JalanBareng.apk --title "Jalan Bareng $VER" \
            --notes "Unduh JalanBareng.apk lalu pasang di HP. Link tetap: https://github.com/${{ github.repository }}/releases/latest/download/JalanBareng.apk" --latest
