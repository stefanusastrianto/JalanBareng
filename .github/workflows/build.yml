name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lib/**", "assets/**", "pubspec.yaml", "tool/**", ".github/workflows/build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cek secrets
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          FB: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret DEBUG_KEYSTORE_B64 belum diisi. Jalankan workflow 'Buat kunci tanda tangan' dulu (lihat README)."; exit 1; fi
          if [ -z "$FB" ]; then echo "::error::Secret FIREBASE_API_KEY belum diisi (lihat README langkah 3)."; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true

      - name: Siapkan folder Android
        run: |
          flutter create --platforms=android --org id.jalanbareng --project-name jalan_bareng .
          python3 tool/patch_android.py

      - name: Pasang kunci tanda tangan
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          printf '%s' "$KS" | tr -d '\r\n ' | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          ANDROID_CERT_SHA1: ${{ secrets.ANDROID_CERT_SHA1 }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          flutter pub get
          args=()
          for n in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_SENDER_ID FIREBASE_PROJECT_ID GOOGLE_WEB_CLIENT_ID GEMINI_API_KEY PLACES_API_KEY ANDROID_CERT_SHA1 FIREBASE_STORAGE_BUCKET; do
            v="$(printf '%s' "${!n}" | tr -d '\r\n ')"
            [ -n "$v" ] && args+=("--dart-define=$n=$v")
          done
          flutter build apk --release "${args[@]}"

      - name: Cek tanda tangan APK
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA1:|SHA-1:" | sed 's/^/SHA-1 APK (pakai titik): /; s/:/./g'

      - uses: actions/upload-artifact@v4
        with:
          name: jalan-bareng-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
