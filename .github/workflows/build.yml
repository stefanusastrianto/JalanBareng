name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cek secrets
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          FB: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret DEBUG_KEYSTORE_B64 belum diisi. Jalankan workflow 'Buat kunci tanda tangan' dulu (lihat README)."; exit 1; fi
          if [ -z "$FB" ]; then echo "::error::Secret FIREBASE_API_KEY belum diisi (lihat README langkah 3)."; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true

      - name: Siapkan folder Android
        run: |
          flutter create --platforms=android --org id.jalanbareng --project-name jalan_bareng .
          python3 tool/patch_android.py

      - name: Pasang kunci tanda tangan
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --dart-define=PLACES_API_KEY=${{ secrets.PLACES_API_KEY }} \
            --dart-define=ANDROID_CERT_SHA1=${{ secrets.ANDROID_CERT_SHA1 }}

      - uses: actions/upload-artifact@v4
        with:
          name: jalan-bareng-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
