name: Buat kunci tanda tangan (sekali saja)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Buat keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jalan Bareng,O=Keluarga,C=ID"
          base64 -w0 debug.keystore > DEBUG_KEYSTORE_B64.txt
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:" > SIDIK_JARI.txt
          SHA1=$(grep "SHA1:" SIDIK_JARI.txt | sed 's/.*SHA1: //')
          echo "$SHA1" > ANDROID_CERT_SHA1.txt
          echo "SHA-1 kunci: $SHA1"
          {
            echo "## Kunci tanda tangan dibuat"
            echo ""
            echo "SHA-1 (daftarkan di Firebase dan Google Cloud):"
            echo '```'
            echo "$SHA1"
            echo '```'
            echo "Unduh artifact **kunci-tanda-tangan**, lalu isi secret DEBUG_KEYSTORE_B64 dan ANDROID_CERT_SHA1 dari file di dalamnya."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kunci-tanda-tangan
          path: |
            DEBUG_KEYSTORE_B64.txt
            ANDROID_CERT_SHA1.txt
            SIDIK_JARI.txt
          retention-days: 7
