name: Cek kelengkapan secrets

on:
  workflow_dispatch:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - name: Cek (hanya ada/tidak, isi tidak ditampilkan)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          ANDROID_CERT_SHA1: ${{ secrets.ANDROID_CERT_SHA1 }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: |
          shape() { # $1 name, $2 regex
            v="${!1}"
            if [ -z "$v" ]; then echo "KOSONG  $1"; return; fi
            v="$(printf '%s' "$v" | tr -d '\r\n ')"
            if printf '%s' "$v" | grep -Eq "$2"; then echo "OK      $1"; else echo "FORMAT? $1 (panjang ${#v})"; fi
          }
          {
          shape DEBUG_KEYSTORE_B64 '^[A-Za-z0-9+/=]{1000,}$'
          shape ANDROID_CERT_SHA1 '^([0-9A-F]{2}:){19}[0-9A-F]{2}$'
          shape FIREBASE_API_KEY '^AIza[0-9A-Za-z_-]{35}$'
          shape FIREBASE_APP_ID '^1:[0-9]+:android:[0-9a-f]+$'
          shape FIREBASE_SENDER_ID '^[0-9]{6,}$'
          shape FIREBASE_PROJECT_ID '^[a-z][a-z0-9-]{4,}$'
          shape GOOGLE_WEB_CLIENT_ID '^[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com$'
          shape GEMINI_API_KEY '^AIza[0-9A-Za-z_-]{35}$'
          shape PLACES_API_KEY '^AIza[0-9A-Za-z_-]{35}$'
          } | tee hasil.txt
          SECRET_SHA="$(printf '%s' "$ANDROID_CERT_SHA1" | tr -d '\r\n ')"
          [ "$SECRET_SHA" != "$ANDROID_CERT_SHA1" ] && echo "Catatan: ANDROID_CERT_SHA1 mengandung spasi/enter tambahan"
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > ks 2>/dev/null
          KS_SHA="$(keytool -list -v -keystore ks -storepass android -alias androiddebugkey 2>/dev/null | grep "SHA1:" | sed 's/.*SHA1: //' | tr -d '\r\n ')"
          echo "SHA1 keystore (pakai titik): $(printf '%s' "$KS_SHA" | tr ':' '.')"
          [ "$KS_SHA" = "E7:F7:9C:F6:F4:A5:D5:38:51:E2:36:10:96:D1:64:45:84:6A:F6:BD" ] && echo "SHA1 keystore = kunci terbaru (E7:F7...)" || echo "SHA1 keystore BEDA dari kunci terbaru"
          [ "$KS_SHA" = "$SECRET_SHA" ] && echo "SHA1 secret = SHA1 keystore" || echo "SHA1 secret BEDA dari keystore"
          G="$(printf '%s' "$GEMINI_API_KEY" | tr -d '\r\n ')"
          echo "Gemini: awalan ${G:0:4}, panjang ${#G}, ada '=': $(printf '%s' "$G" | grep -q '=' && echo ya || echo tidak), ada kutip: $(printf '%s' "$G" | grep -q '[\"'"'"']' && echo ya || echo tidak)"
          [ "$(printf '%s' "$FIREBASE_SENDER_ID")" = "$(printf '%s' "$FIREBASE_APP_ID" | cut -d: -f2)" ] && echo "SENDER_ID cocok dengan APP_ID" || echo "SENDER_ID TIDAK cocok dengan APP_ID"
          [ -n "$FIREBASE_API_KEY" ] && [ "$FIREBASE_API_KEY" = "$GEMINI_API_KEY" ] && echo "Catatan: GEMINI_API_KEY sama dengan FIREBASE_API_KEY" || true
          [ -n "$PLACES_API_KEY" ] && [ "$PLACES_API_KEY" = "$GEMINI_API_KEY" ] && echo "Catatan: PLACES_API_KEY sama dengan GEMINI_API_KEY" || true
      - name: Tes panggil Gemini dan Places (hanya status, kunci tidak ditampilkan)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          ANDROID_CERT_SHA1: ${{ secrets.ANDROID_CERT_SHA1 }}
        run: |
          G="$(printf '%s' "$GEMINI_API_KEY" | tr -d '\r\n ')"
          P="$(printf '%s' "$PLACES_API_KEY" | tr -d '\r\n ')"
          CERT="$(printf '%s' "$ANDROID_CERT_SHA1" | tr -d '\r\n :' | tr a-f A-F)"
          for M in gemini-2.5-flash gemini-flash-latest; do
            code=$(curl -s -o g.json -w '%{http_code}' -H "x-goog-api-key: $G" -H 'Content-Type: application/json' \
              -X POST "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent" \
              -d '{"contents":[{"parts":[{"text":"Jawab satu kata: halo"}]}]}')
            echo "GEMINI $M -> HTTP $code"
            [ "$code" != 200 ] && python3 -c "import json;d=json.load(open('g.json'));e=d.get('error',{});print('  ',e.get('status'),'-',e.get('message','')[:200])" || true
          done
          code=$(curl -s -o p.json -w '%{http_code}' -X POST https://places.googleapis.com/v1/places:searchText \
            -H "X-Goog-Api-Key: $P" -H 'Content-Type: application/json' \
            -H 'X-Android-Package: id.jalanbareng.jalan_bareng' -H "X-Android-Cert: $CERT" \
            -H 'X-Goog-FieldMask: places.displayName,places.rating' -d '{"textQuery":"Keraton Kasepuhan Cirebon","maxResultCount":1}')
          echo "PLACES -> HTTP $code"
          python3 -c "import json;d=json.load(open('p.json'));e=d.get('error');print('  ',(e.get('status'),e.get('message','')[:200]) if e else d)"
