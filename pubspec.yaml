name: jalan_bareng
description: Itinerary liburan keluarga - jadwal, booking, biaya, dan chat pencatat.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10

flutter:
  uses-material-design: true
  assets:
    - assets/seed.json
